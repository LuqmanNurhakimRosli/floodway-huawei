<style>
@font-face { font-family: 'Inter'; src: url('assets/fonts/Inter-Variable.ttf') format('truetype'); font-weight: 100 900; font-display: block; }
:root {
  --bg: #F4F7FB; --card: #FFFFFF; --navy: #071426; --ink: #0B1B33; --muted: #4A5B73; --soft: #7A8BA3; --line: #D7E0EC;
  --accent: #1677FF; --dark: #003EB3; --sky: #E8F1FF;
  --normal: #16A34A; --advisory: #EAB308; --warning: #F97316; --danger: #DC2626;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
body.transparent, body.transparent #stage { background: transparent; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg);
  font-family: Inter, system-ui, sans-serif; color: var(--navy); -webkit-font-smoothing: antialiased; }
.scene { position: absolute; inset: 0; display: none; overflow: hidden; }
.scene.on { display: block; }
.abs { position: absolute; }
.num { font-variant-numeric: tabular-nums; }
svg.ic { display: inline-block; flex: none; vertical-align: middle; }

/* chapter tag, top left */
.chapter { position: absolute; left: 96px; top: 56px; display: flex; align-items: center; gap: 14px; font-size: 20px;
  font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--dark); z-index: 20; }
.chapter b { color: var(--accent); font-weight: 800; }
.chapter i { width: 36px; height: 3px; background: var(--accent); border-radius: 2px; }
.dark .chapter, .dark .chapter span { color: #BFD6FF; }

/* type */
.h1 { font-size: 64px; font-weight: 800; letter-spacing: -.02em; line-height: 1.06; color: var(--navy); }
.h2 { font-size: 44px; font-weight: 800; letter-spacing: -.015em; line-height: 1.1; color: var(--navy); }
.lead { font-size: 30px; line-height: 1.35; color: var(--muted); }
.label { font-size: 20px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--dark); }
.small { font-size: 22px; color: var(--muted); line-height: 1.35; }

/* surfaces */
.card { background: #fff; border: 1.5px solid var(--line); border-radius: 24px; box-shadow: 0 12px 32px rgba(7,20,38,.07); }
.pill { display: inline-flex; align-items: center; gap: 10px; padding: 8px 18px; border-radius: 999px; font-size: 22px;
  font-weight: 600; background: var(--sky); color: var(--dark); border: 1px solid #B7D3FF; white-space: nowrap; }
.pill.sample { background: #FFF4D6; color: #7A4E00; border-color: #F2D48A; }
.pill.muted { background: #EEF1F5; color: var(--muted); border-color: #CDD6E1; }
.pill.dark { background: var(--dark); color: #fff; border-color: var(--dark); }

/* logo plate (the presenter circle, bottom right, is composited by assemble.py) */
.logos { display: flex; align-items: center; gap: 18px; padding: 10px 22px; background: #fff; border: 1.5px solid var(--line);
  border-radius: 18px; box-shadow: 0 8px 20px rgba(7,20,38,.08); }
.logos i { width: 1.5px; align-self: stretch; background: var(--line); }
.logos .lg-uitm { height: 46px; }
.logos .lg-sdp { height: 58px; }
.logos .lg-fw { display: flex; align-items: center; gap: 8px; }
.logos .lg-fw img { height: 36px; }
.logos .lg-fw b { font-size: 24px; font-weight: 800; color: var(--navy); letter-spacing: -.01em; }
.logos.strip { position: absolute; right: 96px; top: 28px; z-index: 44; opacity: 0; padding: 6px 16px; gap: 14px; }
.logos.strip .lg-uitm { height: 34px; } .logos.strip .lg-sdp { height: 44px; }
.logos.strip .lg-fw img { height: 28px; } .logos.strip .lg-fw b { font-size: 19px; }

/* lower third: sits just left of the presenter circle (x 1612 to 1860, y 792 to 1040) */
.lt { position: absolute; right: 340px; bottom: 112px; height: 104px; display: flex; z-index: 40; visibility: hidden;
  box-shadow: 0 10px 30px rgba(7,20,38,.25); }
.lt-stripe { width: 10px; background: var(--accent); }
.lt-text { background: var(--dark); color: #fff; padding: 0 34px 0 26px; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
.lt-text b { font-size: 36px; font-weight: 800; letter-spacing: .01em; line-height: 1.1; }
.lt-text span { font-size: 24px; color: #BFD6FF; font-weight: 500; }

/* phone */
.phone { position: absolute; border-radius: 58px; background: #0B1220; padding: 12px;
  box-shadow: 0 40px 80px rgba(7,20,38,.28), inset 0 0 0 2px #27324A; }
.phone-screen { position: relative; border-radius: 46px; overflow: hidden; background: #fff; }
.phone-island { position: absolute; top: 22px; left: 50%; width: 112px; height: 32px; margin-left: -56px; border-radius: 20px; background: #0B1220; z-index: 5; }
.phone-img { position: absolute; left: 0; top: 0; width: 100%; height: auto; display: block; }

/* level colours */
.lv-normal { --c: var(--normal); } .lv-advisory { --c: var(--advisory); } .lv-warning { --c: var(--warning); } .lv-danger { --c: var(--danger); }

/* preview player (only with ?play) */
#hud { position: fixed; left: 12px; bottom: 12px; z-index: 999; font: 600 16px/1 ui-monospace, monospace; color: #fff;
  background: rgba(7,20,38,.75); padding: 8px 12px; border-radius: 8px; display: none; }
</style>
