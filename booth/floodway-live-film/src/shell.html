<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; font-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>FloodWay: Live Vision film</title>
<style>
/*FONTS*/
:root {
  --navy: #041A22; --deep: #062A33; --deep2: #0A4048; --teal: #0E7C86; --wave: #1E709E; --blue: #1677FF; --sky: #7CC8E4;
  --ink: #EAF6FA; --muted: #9DBBC6; --gold: #E8C98A; --green: #18B57A; --amber: #F2A20F; --red: #E5484D; --paper: #F1F6F7;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--navy); }
body { font-family: Outfit, 'Segoe UI', sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
#stage { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(120% 90% at 50% 40%, #07303A 0%, var(--navy) 70%); }
.bloom { position: absolute; width: 1400px; height: 1400px; border-radius: 50%; filter: blur(40px); opacity: .55; will-change: transform; }
#bloomA { background: radial-gradient(circle, rgba(30,112,158,.55), transparent 62%); }
#bloomB { background: radial-gradient(circle, rgba(14,124,134,.45), transparent 62%); }
#rain { position: absolute; inset: 0; }
.scene { position: absolute; inset: 0; opacity: 0; will-change: transform, opacity; transform-origin: 50% 50%; }
.kicker { font-size: 26px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--sky); }
.line { display: block; overflow: hidden; padding-bottom: .08em; }
.line > span { display: inline-block; will-change: transform; }
.gold { color: var(--gold); }
.note { position: absolute; left: 80px; bottom: 44px; font-size: 22px; color: var(--muted); letter-spacing: .02em; }
.note b { color: var(--ink); font-weight: 600; }

/* S1 hook */
#s1 .big { position: absolute; left: 140px; top: 300px; font-size: 104px; font-weight: 800; line-height: 1.04; letter-spacing: -.02em; }
#s1 .big .l1 { font-size: 64px; font-weight: 600; color: var(--muted); }

/* S2 gap */
#s2 .cards { position: absolute; left: 140px; top: 210px; display: grid; gap: 26px; width: 1080px; }
.fact { display: grid; grid-template-columns: 300px 1fr; align-items: center; gap: 36px; padding: 30px 40px; border-radius: 30px;
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(6px); }
.fact b { font-size: 92px; font-weight: 800; line-height: 1; color: #FF8A8E; letter-spacing: -.02em; }
.fact span { font-size: 38px; line-height: 1.25; color: var(--ink); }
#s2 .turn { position: absolute; left: 0; right: 0; top: 440px; text-align: center; font-size: 96px; font-weight: 800; letter-spacing: -.02em; }
#s2 .camgrid { position: absolute; left: 50%; top: 610px; transform: translateX(-50%); display: flex; gap: 22px; }
.camdot { width: 64px; height: 64px; border-radius: 18px; border: 2px solid rgba(124,200,228,.6); display: grid; place-items: center; color: var(--sky); }
.camdot svg { width: 34px; height: 34px; }

/* S3 live vision */
#monitor { position: absolute; left: 80px; top: 150px; width: 1120px; height: 630px; border-radius: 30px; overflow: hidden;
  box-shadow: 0 50px 90px -40px rgba(0,0,0,.8), 0 0 0 2px rgba(255,255,255,.14); background: #000; }
#monitor img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; }
#monitor .hud { position: absolute; font-family: Outfit; font-weight: 700; font-size: 24px; padding: 6px 14px; border-radius: 10px; background: rgba(0,0,0,.62); color: #fff; letter-spacing: .04em; }
#hudTime { left: 22px; top: 20px; } #hudCam { right: 22px; top: 20px; }
#hudSample { left: 22px; bottom: 20px; background: #F2A20F !important; color: #241500 !important; }
#overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
#monGlow { position: absolute; inset: 0; border-radius: 30px; pointer-events: none; }
#s3 .side { position: absolute; left: 1270px; top: 170px; width: 580px; }
#s3 .side h2 { margin-top: 18px; font-size: 52px; line-height: 1.08; font-weight: 800; letter-spacing: -.015em; }
#pct { margin-top: 44px; font-size: 168px; font-weight: 800; line-height: .9; letter-spacing: -.04em; }
#pct small { font-size: 60px; font-weight: 700; }
#pctSub { font-size: 30px; color: var(--muted); margin-top: 8px; }
#pill { display: inline-flex; align-items: center; gap: 12px; margin-top: 30px; padding: 12px 26px; border-radius: 999px; font-size: 34px; font-weight: 800; letter-spacing: .06em; }
#pill i { width: 18px; height: 18px; border-radius: 50%; background: currentColor; display: block; }
#bar { position: relative; margin-top: 34px; height: 18px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; }
#barFill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; }
.tick { position: absolute; top: -4px; width: 3px; height: 26px; background: rgba(255,255,255,.55); }
#s3 .fine { margin-top: 26px; font-size: 26px; line-height: 1.4; color: var(--muted); }
#toast { position: absolute; left: 330px; top: 172px; width: 660px; padding: 22px 28px; border-radius: 22px; background: #fff; color: #3A0D10;
  box-shadow: 0 30px 60px -20px rgba(0,0,0,.6); display: grid; grid-template-columns: 64px 1fr; gap: 20px; align-items: center; opacity: 0; }
#toast .ic { width: 64px; height: 64px; border-radius: 18px; background: var(--red); display: grid; place-items: center; color: #fff; font-size: 34px; font-weight: 800; }
#toast b { display: block; font-size: 30px; color: #A8232A; letter-spacing: .04em; }
#toast span { font-size: 26px; color: #2A1A1C; }

/* S4 map */
#map { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
#s4 .title { position: absolute; left: 110px; top: 110px; }
#s4 .title h2 { margin-top: 14px; font-size: 64px; font-weight: 800; letter-spacing: -.02em; line-height: 1.05; }
#eta { position: absolute; right: 50px; top: 70px; width: 430px; padding: 30px 34px; border-radius: 28px; background: rgba(4,26,34,.88);
  border: 1px solid rgba(124,200,228,.35); box-shadow: 0 30px 70px -30px rgba(0,0,0,.8); opacity: 0; }
#eta .k { font-size: 24px; font-weight: 700; letter-spacing: .16em; color: var(--green); }
#eta b { display: block; margin-top: 8px; font-size: 46px; font-weight: 800; white-space: nowrap; }
#eta span { display: block; margin-top: 6px; font-size: 28px; color: var(--muted); }

/* S5 phone */
#s5 .copy { position: absolute; left: 140px; top: 300px; width: 820px; }
#s5 h2 { margin-top: 18px; font-size: 96px; line-height: 1; font-weight: 800; letter-spacing: -.025em; }
#s5 p { margin-top: 28px; font-size: 36px; line-height: 1.35; color: var(--muted); }
#phone { position: absolute; left: 1180px; top: 90px; width: 430px; height: 930px; border-radius: 70px; background: #0B1B22; padding: 13px;
  box-shadow: 0 60px 100px -40px rgba(0,0,0,.9), 0 0 0 2px #2A3F48 inset; }
#phone .scr { width: 100%; height: 100%; border-radius: 58px; overflow: hidden; position: relative; background: #fff; }
#phone .scr img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
#phone .island { position: absolute; top: 26px; left: 50%; width: 120px; height: 34px; margin-left: -60px; border-radius: 20px; background: #000; z-index: 3; }
#notif { position: absolute; left: 22px; right: 22px; top: 70px; z-index: 4; padding: 18px 20px; border-radius: 26px; background: rgba(250,250,252,.96);
  box-shadow: 0 20px 40px -14px rgba(0,0,0,.5); color: #111; display: grid; grid-template-columns: 52px 1fr; gap: 14px; }
#notif .ic { width: 52px; height: 52px; border-radius: 14px; background: #fff; display: grid; place-items: center; box-shadow: 0 0 0 1px #E3E8EC; }
#notif .ic img { width: 40px; }
#notif b { font-size: 21px; display: block; color: #111; }
#notif span { font-size: 20px; line-height: 1.3; color: #333; display: block; margin-top: 2px; }
#family { position: absolute; left: 860px; top: 690px; display: grid; gap: 14px; }
.chip { display: flex; align-items: center; gap: 14px; padding: 14px 24px 14px 14px; border-radius: 999px; background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.16); font-size: 28px; font-weight: 600; opacity: 0; }
.chip i { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 800; font-size: 22px; color: #04212A; }
.chip em { font-style: normal; color: var(--green); font-weight: 700; margin-left: 8px; }

/* S6 impact */
#s6 .head { position: absolute; left: 140px; top: 120px; }
#s6 .head h2 { margin-top: 14px; font-size: 72px; font-weight: 800; letter-spacing: -.02em; }
#tl { position: absolute; left: 140px; right: 140px; top: 400px; height: 260px; }
#tlTrack, #tlFill { position: absolute; left: 0; top: 40px; height: 8px; border-radius: 8px; }
#tlTrack { right: 0; background: rgba(255,255,255,.14); }
#tlFill { background: linear-gradient(90deg, var(--amber), var(--green)); }
.node { position: absolute; top: 0; width: 520px; opacity: 0; }
.node .dot { width: 88px; height: 88px; border-radius: 50%; display: grid; place-items: center; font-size: 30px; font-weight: 800; color: #04212A; border: 8px solid var(--navy); }
.node b { display: block; margin-top: 24px; font-size: 48px; font-weight: 800; }
.node span { display: block; margin-top: 8px; font-size: 30px; line-height: 1.3; color: var(--muted); }
#stat { position: absolute; left: 0; right: 0; top: 250px; text-align: center; opacity: 0; }
#stat .num { font-size: 260px; font-weight: 800; line-height: .9; letter-spacing: -.05em; }
#stat .num small { font-size: 120px; }
#stat .lab { margin-top: 18px; font-size: 54px; font-weight: 700; }
#stat .sub { margin-top: 14px; font-size: 32px; color: var(--muted); }
#chips6 { position: absolute; left: 0; right: 0; top: 800px; display: flex; justify-content: center; gap: 20px; opacity: 0; }
#chips6 span { font-size: 32px; font-weight: 700; padding: 14px 30px; border-radius: 999px; background: rgba(24,181,122,.16); border: 1px solid rgba(24,181,122,.5); color: #9BF0CC; }

/* S7 brand */
#s7 .mark { position: absolute; left: 50%; top: 210px; width: 200px; height: 200px; margin-left: -100px; border-radius: 52px; background: #fff;
  display: grid; place-items: center; padding: 30px; box-shadow: 0 40px 80px -30px rgba(0,0,0,.8); }
#s7 .mark img { width: 100%; }
#word { position: absolute; left: 0; right: 0; top: 440px; text-align: center; font-size: 150px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
#word .w { color: var(--sky); }
#tag { position: absolute; left: 0; right: 0; top: 610px; text-align: center; font-size: 50px; font-weight: 700; }
#cta { position: absolute; left: 50%; top: 735px; transform: translateX(-50%); display: flex; align-items: center; gap: 30px; padding: 18px 34px 18px 18px;
  border-radius: 30px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.16); opacity: 0; }
#cta img { width: 150px; height: 150px; background: #fff; padding: 10px; border-radius: 18px; }
#cta b { display: block; font-size: 30px; color: var(--sky); letter-spacing: .1em; text-transform: uppercase; }
#cta span { display: block; margin-top: 6px; font-size: 46px; font-weight: 800; }
#team { position: absolute; left: 0; right: 0; bottom: 60px; text-align: center; font-size: 28px; color: var(--muted); opacity: 0; }
#fade { position: absolute; inset: 0; background: var(--navy); opacity: 0; pointer-events: none; }
#dbg { position: absolute; right: 12px; bottom: 8px; font: 600 18px Outfit; color: #fff; background: rgba(0,0,0,.5); padding: 2px 8px; display: none; }
</style>
</head>
<body>
<div id="stage">
  <div class="bloom" id="bloomA"></div><div class="bloom" id="bloomB"></div>
  <canvas id="rain" width="1920" height="1080"></canvas>
<!--SCENES-->
  <div id="fade"></div><div id="dbg"></div>
</div>
<script>
/*FILM_JS*/
</script>
</body>
</html>
