<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" />
    </marker>
    
    <!-- Gradients & Filters -->
    <linearGradient id="cyanBadge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Outer Frame Box (Matching reference) -->
  <rect x="25" y="25" width="1150" height="550" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />

  <!-- ========================================== -->
  <!-- 1. LEFT SIDE: INPUT SENSORS & CITIZEN -->
  <!-- ========================================== -->
  
  <!-- Cyan Badge: Flood Monitoring -->
  <g transform="translate(180, 70)">
    <rect x="-70" y="0" width="140" height="32" rx="16" fill="url(#cyanBadge)"/>
    <text x="0" y="21" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle" font-style="italic">Flood Monitoring</text>
  </g>

  <!-- Top Input: JSN-SR04T Sensor -->
  <g transform="translate(60, 120)">
    <!-- Ultrasonic Probe Graphic -->
    <rect x="20" y="10" width="55" height="35" rx="5" fill="#0284c7" />
    <circle cx="36" cy="27" r="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2.5"/>
    <circle cx="58" cy="27" r="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2.5"/>
    <!-- Sensor Waves -->
    <path d="M 85 20 A 12 12 0 0 1 85 35" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 92 14 A 18 18 0 0 1 92 41" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <!-- Labels -->
    <text x="47" y="70" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">JSN-SR04T Sensor</text>
    <text x="47" y="88" fill="#64748b" font-size="12" text-anchor="middle">(Water Level)</text>
  </g>

  <!-- Bottom Input: Smartphone Citizen Report -->
  <g transform="translate(60, 310)">
    <!-- Phone body -->
    <rect x="22" y="10" width="50" height="85" rx="8" fill="#1e293b"/>
    <rect x="25" y="15" width="44" height="75" rx="4" fill="#f8fafc"/>
    <!-- Screen content: flood wave and camera -->
    <path d="M 32 60 Q 40 54 47 60 T 62 60" fill="none" stroke="#0284c7" stroke-width="2.5"/>
    <path d="M 32 67 Q 40 61 47 67 T 62 67" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="47" cy="40" r="8" fill="#ef4444" opacity="0.9"/>
    <circle cx="47" cy="40" r="3.5" fill="#ffffff"/>
    <!-- Labels -->
    <text x="47" y="120" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">Citizen Report</text>
    <text x="47" y="138" fill="#64748b" font-size="12" text-anchor="middle">(Photo &amp; GPS Location)</text>
  </g>

  <!-- Input Connecting Arrows into ESP32 -->
  <path d="M 175 155 L 230 155 Q 245 155 245 230 L 275 230" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 175 365 L 230 365 Q 245 365 245 290 L 275 290" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ========================================== -->
  <!-- 2. ESP32 (NODE 1) -->
  <!-- ========================================== -->
  <g transform="translate(285, 185)">
    <!-- Board PCB -->
    <rect x="0" y="0" width="80" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <!-- USB Port -->
    <rect x="25" y="-6" width="30" height="8" rx="2" fill="#94a3b8"/>
    <!-- ESP-WROOM-32 Metal Shield -->
    <rect x="12" y="16" width="56" height="58" rx="4" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="20" y="24" width="40" height="42" fill="#94a3b8" opacity="0.3"/>
    <text x="40" y="44" fill="#334155" font-size="9" font-weight="800" text-anchor="middle">ESP32</text>
    <text x="40" y="55" fill="#475569" font-size="7" text-anchor="middle">Wi-Fi + BT</text>
    <!-- PCB pins -->
    <g fill="#e2e8f0">
      <rect x="3" y="15" width="4" height="6"/><rect x="3" y="27" width="4" height="6"/><rect x="3" y="39" width="4" height="6"/><rect x="3" y="51" width="4" height="6"/><rect x="3" y="63" width="4" height="6"/><rect x="3" y="75" width="4" height="6"/><rect x="3" y="87" width="4" height="6"/><rect x="3" y="99" width="4" height="6"/><rect x="3" y="111" width="4" height="6"/>
      <rect x="73" y="15" width="4" height="6"/><rect x="73" y="27" width="4" height="6"/><rect x="73" y="39" width="4" height="6"/><rect x="73" y="51" width="4" height="6"/><rect x="73" y="63" width="4" height="6"/><rect x="73" y="75" width="4" height="6"/><rect x="73" y="87" width="4" height="6"/><rect x="73" y="99" width="4" height="6"/><rect x="73" y="111" width="4" height="6"/>
    </g>
    <!-- Label -->
    <text x="40" y="180" fill="#0f172a" font-size="16" font-weight="800" text-anchor="middle">ESP32</text>
    <text x="40" y="198" fill="#64748b" font-size="12" text-anchor="middle">IoT Node</text>
  </g>

  <!-- Arrow: Send Input -->
  <g transform="translate(370, 250)">
    <line x1="10" y1="10" x2="90" y2="10" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="50" y="-3" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">Send Input</text>
    <text x="50" y="28" fill="#64748b" font-size="11" text-anchor="middle">(HMAC / JSON)</text>
  </g>

  <!-- ========================================== -->
  <!-- 3. CENTER: HOSTED ON HUAWEI ECS (CLOUD) -->
  <!-- ========================================== -->
  <g transform="translate(480, 110)">
    <!-- Cloud dashed box -->
    <rect x="0" y="0" width="280" height="340" rx="20" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="6 6" />

    <!-- ModelArts Section -->
    <g transform="translate(140, 55)">
      <!-- Authentic ModelArts Blue Hex/Brain Icon -->
      <circle cx="0" cy="0" r="32" fill="#0ea5e9" opacity="0.12"/>
      <path d="M -18 8 L -18 -8 L 0 -18 L 18 -8 L 18 8 L 0 18 Z" fill="none" stroke="#0284c7" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="-18" cy="-8" r="4.5" fill="#0284c7"/>
      <circle cx="18" cy="-8" r="4.5" fill="#0284c7"/>
      <circle cx="0" cy="-18" r="4.5" fill="#0284c7"/>
      <circle cx="0" cy="0" r="6" fill="#0369a1"/>
      <line x1="-18" y1="-8" x2="0" y2="0" stroke="#0284c7" stroke-width="2"/>
      <line x1="18" y1="-8" x2="0" y2="0" stroke="#0284c7" stroke-width="2"/>
      
      <!-- Label -->
      <text x="0" y="42" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">ModelArts Inference</text>
      <text x="0" y="60" fill="#475569" font-size="12" text-anchor="middle">(Flood Prediction &amp; PanGu-CV)</text>
    </g>

    <!-- Cloud Hosting Badge (in the center) -->
    <g transform="translate(140, 185)">
      <rect x="-85" y="-18" width="170" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
      <circle cx="-62" cy="0" r="9" fill="#f97316"/>
      <path d="M -67 2 C -67 -3, -64 -6, -60 -4 C -57 -8, -52 -5, -53 0 L -53 2 Z" fill="#ffffff"/>
      <text x="3" y="5" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">Hosted on Huawei ECS</text>
    </g>

    <!-- Huawei Cloud Services Section -->
    <g transform="translate(140, 245)">
      <!-- Official Huawei 8-Petal Blossom Logo -->
      <g transform="translate(0, 0)">
        <path d="M 0 -22 C -3 -15, -3 -7, 0 0 C 3 -7, 3 -15, 0 -22 Z" fill="#cf0a2c"/>
        <path d="M 15 -15 C 9 -10, 3 -4, 0 0 C 7 -2, 14 -5, 15 -15 Z" fill="#cf0a2c" transform="rotate(45)"/>
        <path d="M 22 0 C 15 3, 7 3, 0 0 C 7 -3, 15 -3, 22 0 Z" fill="#cf0a2c" transform="rotate(45)"/>
        <path d="M 15 15 C 10 9, 4 3, 0 0 C 2 7, 5 14, 15 15 Z" fill="#cf0a2c" transform="rotate(45)"/>
        <path d="M 0 22 C 3 15, 3 7, 0 0 C -3 7, -3 15, 0 22 Z" fill="#cf0a2c"/>
        <path d="M -15 15 C -9 10, -3 4, 0 0 C -7 2, -14 5, -15 15 Z" fill="#cf0a2c" transform="rotate(45)"/>
        <path d="M -22 0 C -15 -3, -7 -3, 0 0 C -7 3, -15 3, -22 0 Z" fill="#cf0a2c" transform="rotate(45)"/>
        <path d="M -15 -15 C -10 -9, -4 -3, 0 0 C -2 -7, -5 -14, -15 -15 Z" fill="#cf0a2c" transform="rotate(45)"/>
      </g>
      <text x="0" y="32" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">HUAWEI CLOUD</text>
      <text x="0" y="50" fill="#475569" font-size="11.5" text-anchor="middle">• Huawei SMN (Push &amp; SMS API)</text>
      <text x="0" y="66" fill="#475569" font-size="11.5" text-anchor="middle">• Decision Backend &amp; Route Engine</text>
    </g>

    <!-- Cyan Badge: Decision Engine -->
    <g transform="translate(140, 375)">
      <rect x="-75" y="0" width="150" height="30" rx="15" fill="url(#cyanBadge)"/>
      <text x="0" y="19" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" font-style="italic">AI &amp; Routing Engine</text>
    </g>
  </g>

  <!-- Arrow: Receive Output -->
  <g transform="translate(765, 250)">
    <line x1="10" y1="10" x2="85" y2="10" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="47" y="-3" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">Receive Output</text>
    <text x="47" y="28" fill="#64748b" font-size="11" text-anchor="middle">(Risk &amp; Route Data)</text>
  </g>

  <!-- ========================================== -->
  <!-- 4. ESP32 (NODE 2 - RECEIVER / GATEWAY) -->
  <!-- ========================================== -->
  <g transform="translate(865, 185)">
    <!-- Board PCB -->
    <rect x="0" y="0" width="80" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="25" y="-6" width="30" height="8" rx="2" fill="#94a3b8"/>
    <rect x="12" y="16" width="56" height="58" rx="4" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="20" y="24" width="40" height="42" fill="#94a3b8" opacity="0.3"/>
    <text x="40" y="44" fill="#334155" font-size="9" font-weight="800" text-anchor="middle">ESP32</text>
    <text x="40" y="55" fill="#475569" font-size="7" text-anchor="middle">Receiver</text>
    <g fill="#e2e8f0">
      <rect x="3" y="15" width="4" height="6"/><rect x="3" y="27" width="4" height="6"/><rect x="3" y="39" width="4" height="6"/><rect x="3" y="51" width="4" height="6"/><rect x="3" y="63" width="4" height="6"/><rect x="3" y="75" width="4" height="6"/><rect x="3" y="87" width="4" height="6"/><rect x="3" y="99" width="4" height="6"/><rect x="3" y="111" width="4" height="6"/>
      <rect x="73" y="15" width="4" height="6"/><rect x="73" y="27" width="4" height="6"/><rect x="73" y="39" width="4" height="6"/><rect x="73" y="51" width="4" height="6"/><rect x="73" y="63" width="4" height="6"/><rect x="73" y="75" width="4" height="6"/><rect x="73" y="87" width="4" height="6"/><rect x="73" y="99" width="4" height="6"/><rect x="73" y="111" width="4" height="6"/>
    </g>
    <!-- Label -->
    <text x="40" y="180" fill="#0f172a" font-size="16" font-weight="800" text-anchor="middle">ESP32</text>
    <text x="40" y="198" fill="#64748b" font-size="12" text-anchor="middle">Client Gateway</text>
  </g>

  <!-- Output Connecting Arrows -->
  <path d="M 950 230 L 975 230 Q 990 230 990 160 L 1025 160" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 950 290 L 975 290 Q 990 290 990 365 L 1025 365" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- "Send Output" Text -->
  <text x="982" y="222" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">Send</text>
  <text x="982" y="236" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">Output</text>

  <!-- ========================================== -->
  <!-- 5. RIGHT SIDE: OUTPUTS -->
  <!-- ========================================== -->

  <!-- Top Output: 16x2 Character LCD & Evacuation Route -->
  <g transform="translate(1035, 115)">
    <!-- LCD Module Board -->
    <rect x="0" y="0" width="130" height="70" rx="4" fill="#059669" stroke="#047857" stroke-width="1.5"/>
    <!-- Mounting Holes -->
    <circle cx="8" cy="8" r="3" fill="#cbd5e1"/>
    <circle cx="122" cy="8" r="3" fill="#cbd5e1"/>
    <circle cx="8" cy="62" r="3" fill="#cbd5e1"/>
    <circle cx="122" cy="62" r="3" fill="#cbd5e1"/>
    <!-- Screen Bezel -->
    <rect x="15" y="14" width="100" height="42" rx="2" fill="#064e3b"/>
    <!-- Screen Pixel Grid Background -->
    <rect x="19" y="18" width="92" height="34" fill="#10b981"/>
    <!-- LCD Text Display -->
    <text x="25" y="32" fill="#064e3b" font-family="Courier, monospace" font-size="11" font-weight="bold">ROUTE: SHELTER 1</text>
    <text x="25" y="46" fill="#064e3b" font-family="Courier, monospace" font-size="11" font-weight="bold">SAFE · 62 MIN EVAC</text>

    <!-- Evacuation Route Sign Icon -->
    <g transform="translate(85, -28)">
      <rect x="0" y="0" width="36" height="24" rx="3" fill="#15803d"/>
      <text x="18" y="16" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">EXIT ➔</text>
    </g>

    <!-- Labels -->
    <text x="65" y="95" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">16x2 Character LCD</text>
    <text x="65" y="112" fill="#64748b" font-size="12" text-anchor="middle">Display Evacuation Route</text>
  </g>

  <!-- Bottom Output: Speaker & Telegram Alert -->
  <g transform="translate(1035, 335)">
    <!-- Blue Speaker Siren Icon -->
    <g transform="translate(15, 10)">
      <path d="M 0 15 L 12 15 L 24 5 L 24 35 L 12 25 L 0 25 Z" fill="#0284c7"/>
      <path d="M 30 12 A 12 12 0 0 1 30 28" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 36 6 A 20 20 0 0 1 36 34" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round"/>
    </g>
    
    <!-- Telegram Logo -->
    <g transform="translate(85, 10)">
      <circle cx="20" cy="20" r="22" fill="#0ea5e9"/>
      <!-- Paper Plane -->
      <path d="M 8 19 L 31 11 L 24 30 L 19 23 L 13 25 Z" fill="#ffffff"/>
      <path d="M 19 23 L 23 20" stroke="#cbd5e1" stroke-width="1.5"/>
    </g>

    <!-- Labels -->
    <text x="65" y="78" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">Speaker &amp; Telegram</text>
    <text x="65" y="96" fill="#64748b" font-size="12" text-anchor="middle">SOS Siren &amp; Alert Message</text>
  </g>

</svg>
